name: wer-bench

# Accuracy and speed of the offline voice models on public LibriSpeech test sets, on four kinds of machine
# (README benchmark table). Same runtime (sherpa-onnx 1.13.8), files and SHA-256 pins as the apps' downloads.
on:
  push:
    # Branch pushes only: path filters are not evaluated for tags, so every release tag used to start this benchmark
    # (models and LibriSpeech downloaded on four runners).
    branches: ["**"]
    paths: [".github/workflows/wer-bench.yml", "keyboard/ci/wer_bench.py"]
  workflow_dispatch:
    inputs:
      n_clean:
        description: "test-clean utterances"
        default: "200"
      n_other:
        description: "test-other utterances"
        default: "100"

permissions:
  contents: read

jobs:
  bench:
    name: bench (${{ matrix.device }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, device: "Linux x64 (GitHub runner)" }
          - { os: ubuntu-24.04-arm, device: "Linux arm64 (GitHub runner)" }
          - { os: macos-14, device: "macOS Apple Silicon (GitHub runner)" }
          - { os: windows-2022, device: "Windows x64 (GitHub runner)" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      BENCH_DEVICE: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Tools
        run: python -m pip install -q sherpa-onnx==1.13.8 jiwer soundfile
      - name: Models (same files, SHA-256 and size as the app's download)
        run: |
          mkdir -p m && cd m
          # name:sha256:bytes, the pins in keyboard/.../VoiceModels.kt and desktop/src-tauri/src/models.rs (the desktop
          # app refuses a download whose size differs, so the size is checked here too).
          for f in sherpa-onnx-moonshine-tiny-en-quantized-2026-02-27:9ec31b342d8fa3240c3b81b8f82e1cf7e3ac467c93ca5a999b741d5887164f8d:29858559 \
                   sherpa-onnx-nemo-parakeet_tdt_ctc_110m-en-36000-int8:17f945007b52ccd8b7200ffc7c5652e9e8e961dfdf479cefcabd06cf5703630b:104337827 \
                   sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8:6fc4426b54aa549a0019b8a75b8dea59164e71790a37ac56a045ad57f915f714:482440461 \
                   sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8:1495e91b59d7fc53ddca91f3431758ec99f8fa253fdb0e1e851be0f72b14b0f9:487211443; do
            IFS=: read -r n h size <<< "$f"
            curl -sSL --retry 3 -o "$n.tar.bz2" "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/$n.tar.bz2"
            got=$(python -c "import hashlib,os,sys;p=sys.argv[1];print(hashlib.sha256(open(p,'rb').read()).hexdigest(),os.path.getsize(p))" "$n.tar.bz2")
            [ "$got" = "$h $size" ] || { echo "sha256 or size mismatch for $n: $got"; exit 1; }
            tar xjf "$n.tar.bz2" && rm "$n.tar.bz2"
            # The apps unpack <name>/<file>. Without that folder wer_bench.py would skip the model and still pass.
            [ -d "$n" ] || { echo "::error::$n.tar.bz2 does not unpack to a folder named $n"; exit 1; }
            # File names and sizes inside (the apps keep the ones wer_bench.py loads; their sum is disk_bytes).
            python -c "import os,sys;d=sys.argv[1];[print(d,f,os.path.getsize(os.path.join(d,f))) for f in sorted(os.listdir(d)) if os.path.isfile(os.path.join(d,f))]" "$n"
          done
      - name: LibriSpeech test-clean + test-other (OpenSLR 12, CC BY 4.0)
        run: |
          for s in test-clean test-other; do curl -sSL --retry 3 -o "$s.tar.gz" "https://www.openslr.org/resources/12/$s.tar.gz"; tar xzf "$s.tar.gz"; rm "$s.tar.gz"; done
          ls LibriSpeech
      - name: Bench
        run: |
          python keyboard/ci/wer_bench.py m LibriSpeech wer.json "${{ inputs.n_clean || '200' }}" "${{ inputs.n_other || '100' }}" | tee bench.log
          { echo "### $BENCH_DEVICE"; echo '```'; cat wer.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # Every model downloaded above must be in the report (wer_bench.py skips a model whose folder is missing), and
          # one that loads but decodes nonsense must not pass: on 50 or more test-clean clips every model is under 5 %.
          python - lite fast best multi <<'EOF'
          import json, sys
          models = json.load(open("wer.json"))["models"]
          bad = ["%s was not benchmarked" % k for k in sys.argv[1:] if k not in models]
          for k, m in models.items():
              clean = m.get("test-clean")
              if clean and clean["n"] >= 50 and clean["wer_pct"] > 10:
                  bad.append("%s: test-clean WER %s %%" % (k, clean["wer_pct"]))
          sys.exit("wer-bench: " + "; ".join(bad) if bad else 0)
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: wer-bench-${{ matrix.os }}
          path: |
            wer.json
            bench.log
