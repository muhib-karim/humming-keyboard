name: keyboard

# Humming keyboard (FlorisBoard base, keyboard/): unit tests with JaCoCo line coverage, debug APK, Android lint (a gate
# with a baseline of pre-existing issues, docs/ci/STATIC_ANALYSIS.md) and the release APK.
on:
  push:
    branches: ["main", "upgrade/**"]
    paths: ["keyboard/**", ".github/workflows/keyboard.yml"]
  pull_request:
    paths: ["keyboard/**", ".github/workflows/keyboard.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keyboard-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK platform 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;35.0.0" > /dev/null
      - name: Restore gradlew exec bit (web upload drops file mode)
        working-directory: keyboard
        run: chmod +x gradlew
      - name: Unit tests (with coverage) + debug APK
        working-directory: keyboard
        # app module tests: upstream v0.5.2 lib:snygg tests reference a missing package and do not compile
        run: ./gradlew --no-daemon :app:createDebugUnitTestCoverageReport :app:assembleDebug
      - name: Line coverage (JaCoCo)
        run: |
          set -euo pipefail
          XML=$(find keyboard/app/build/reports/coverage -name report.xml | head -1)
          mkdir -p coverage
          python3 scripts/coverage_summary.py "$XML" --prefix com/humming/keyboard --json coverage/coverage.json \
            | tee coverage/coverage.md
          { echo "### Unit-test line coverage"; cat coverage/coverage.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: sha256
        run: cd keyboard/app/build/outputs/apk/debug && sha256sum *.apk | tee apk-sha256.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: keyboard-apk
          path: |
            keyboard/app/build/outputs/apk/debug/
            keyboard/app/build/reports/tests/
            keyboard/app/build/reports/coverage/
            coverage/
          retention-days: 30

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK platform 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;35.0.0" > /dev/null
      - name: Restore gradlew exec bit (web upload drops file mode)
        working-directory: keyboard
        run: chmod +x gradlew
      - name: Lint (fails on any error not in app/lint-baseline.xml; a missing baseline is written and fails)
        working-directory: keyboard
        run: ./gradlew --no-daemon :app:lintDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-lint
          path: |
            keyboard/app/build/reports/lint-results-debug.*
            keyboard/app/lint-baseline.xml
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK platform 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;35.0.0" > /dev/null
      - name: Restore gradlew exec bit (web upload drops file mode)
        working-directory: keyboard
        run: chmod +x gradlew
      - name: Release APK (R8, development-key signed)
        working-directory: keyboard
        run: ./gradlew --no-daemon :app:assembleRelease -Phumming.abis=arm64-v8a
      - name: sha256
        run: cd keyboard/app/build/outputs/apk/release && sha256sum *.apk | tee apk-sha256.txt && ls -l
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: keyboard-release-apk
          path: keyboard/app/build/outputs/apk/release/
          retention-days: 30

