name: quality

# Humming 1.7.1 gates that need no Android build (docs/ci/STATIC_ANALYSIS.md):
#   - ktlint and detekt on the Android keyboard's Kotlin, pinned release files, each with a committed baseline in
#     keyboard/config/ that holds only findings from before 1.7.1 (a missing baseline fails, it is never auto-created);
#   - gitleaks over the whole git history;
#   - the website: assembled exactly as pages.yml does, then every link, image and anchor checked;
#   - the Python release, coverage, emulator-metrics and update-verifier script tests.
# Android lint is the "lint" job in keyboard.yml; CodeQL is codeql.yml.
# Pull requests: ci.yml calls this workflow on every one (its "gate" job is the required check).
on:
  push:
    branches: ["main", "upgrade/**"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when ci.yml calls this workflow, so the two never cancel each other.
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin:
    name: ktlint + detekt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"
      - name: ktlint
        run: bash keyboard/ci/static_checks.sh ktlint
      - name: detekt
        if: ${{ !cancelled() }}
        run: bash keyboard/ci/static_checks.sh detekt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: static-analysis
          path: build/static/
          if-no-files-found: ignore
          retention-days: 30

  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.21.2"
      GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (release archive, SHA-256 pinned)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
      - name: Scan every commit
        run: |
          mkdir -p build/static
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --report-path build/static/gitleaks.json --report-format json .
          echo "gitleaks: 0 findings (report: build/static/gitleaks.json)"

  site-and-scripts:
    name: website check + script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Assemble and check the website (same scripts as pages.yml)
        run: |
          python3 scripts/assemble_site.py _site
          python3 scripts/check_site.py _site
      - name: Script tests
        run: python3 -W error::ResourceWarning -m unittest discover -s scripts -p 'test_*.py' -v
