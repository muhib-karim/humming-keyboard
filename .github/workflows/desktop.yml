name: desktop

# Humming for macOS, Windows and Linux (Tauri v2). Builds unsigned installers as workflow artifacts:
# a universal macOS .dmg, Windows .msi + NSIS setup .exe, and Linux .AppImage + .deb. Nothing is released or signed here.

on:
  push:
    paths: ["desktop/**", "core/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "core/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (Linux compile + unit tests)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libxdo-dev libssl-dev cmake clang > /dev/null
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"
          prefix-key: v3-sherpa
      - name: sherpa-onnx static libraries present
        # sherpa-onnx-sys downloads its prebuilt static libraries into target/sherpa-onnx-prebuilt from its build
        # script. The Rust cache prunes the library files but can leave the empty lib/ folders behind, and the build
        # script trusts any existing lib/ folder, so linking fails ("could not find native static library
        # sherpa-onnx-c-api"). When the libraries are missing, delete the whole prebuilt folder (empty dirs included)
        # and re-run the build script, so it downloads and unpacks a fresh copy.
        shell: bash
        working-directory: desktop/src-tauri
        run: |
          if [ -d target ] && ! find target -path '*sherpa-onnx-prebuilt*' \( -name 'libsherpa-onnx-c-api*' -o -name 'sherpa-onnx-c-api*.lib' \) | grep -q .; then
            echo "prebuilt sherpa-onnx libraries missing from the cache: removing the stale folder, re-running its build script"
            find target -maxdepth 4 -type d -name sherpa-onnx-prebuilt -prune -exec rm -rf {} +
            cargo clean -p sherpa-onnx-sys || true
            for t in $(echo "${RUST_TARGETS:-}" | tr ',' ' '); do cargo clean -p sherpa-onnx-sys --target "$t" || true; done
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Frontend (type check + build)
        working-directory: desktop
        run: npm ci && npm run build
      - name: cargo test (desktop shell, cleanup port, model catalog)
        working-directory: desktop/src-tauri
        run: cargo test
      - name: End to end on a real clip (Fast model download + SHA-256 + unpack, Parakeet, cleanup)
        working-directory: desktop/src-tauri
        run: |
          mkdir -p "$RUNNER_TEMP/clip" && cd "$RUNNER_TEMP/clip"
          curl -sSL -o m.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-nemo-parakeet_tdt_ctc_110m-en-36000-int8.tar.bz2
          tar xjf m.tar.bz2 --wildcards '*/test_wavs/*' && rm m.tar.bz2
          WAV=$(find "$RUNNER_TEMP/clip" -name '*.wav' | sort | head -1); echo "clip: $WAV"
          cd "$GITHUB_WORKSPACE/desktop/src-tauri"
          HUMMING_E2E_WAV="$WAV" cargo test e2e_fast_model_on_a_real_clip -- --nocapture 2>&1 | tee "$RUNNER_TEMP/e2e.log"
          grep '^E2E' "$RUNNER_TEMP/e2e.log" >> "$GITHUB_STEP_SUMMARY"
      - name: core tests without whisper.cpp (VAD, lists, dictionary)
        working-directory: core
        run: cargo test --no-default-features --lib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-Cargo.lock
          path: desktop/src-tauri/Cargo.lock
          if-no-files-found: ignore

  build:
    needs: check
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: windows-x64
            os: windows-latest
            args: ""
            rust_targets: ""
          - name: linux-x64
            os: ubuntu-22.04
            args: --bundles appimage,deb
            rust_targets: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libxdo-dev libssl-dev cmake clang patchelf file > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"
          key: ${{ matrix.name }}
          prefix-key: v3-sherpa
      - name: sherpa-onnx static libraries present
        # sherpa-onnx-sys downloads its prebuilt static libraries into target/sherpa-onnx-prebuilt from its build
        # script. The Rust cache prunes the library files but can leave the empty lib/ folders behind, and the build
        # script trusts any existing lib/ folder, so linking fails ("could not find native static library
        # sherpa-onnx-c-api"). When the libraries are missing, delete the whole prebuilt folder (empty dirs included)
        # and re-run the build script, so it downloads and unpacks a fresh copy.
        shell: bash
        working-directory: desktop/src-tauri
        env:
          RUST_TARGETS: ${{ matrix.rust_targets }}
        run: |
          if [ -d target ] && ! find target -path '*sherpa-onnx-prebuilt*' \( -name 'libsherpa-onnx-c-api*' -o -name 'sherpa-onnx-c-api*.lib' \) | grep -q .; then
            echo "prebuilt sherpa-onnx libraries missing from the cache: removing the stale folder, re-running its build script"
            find target -maxdepth 4 -type d -name sherpa-onnx-prebuilt -prune -exec rm -rf {} +
            cargo clean -p sherpa-onnx-sys || true
            for t in $(echo "${RUST_TARGETS:-}" | tr ',' ' '); do cargo clean -p sherpa-onnx-sys --target "$t" || true; done
          fi
      - name: npm ci
        working-directory: desktop
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
      - name: Collect installers and checksums
        shell: bash
        run: |
          mkdir -p out
          find desktop/src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} out/ \;
          cd out
          if command -v sha256sum > /dev/null; then sha256sum -- * > ../SHA256SUMS.txt; else shasum -a 256 -- * > ../SHA256SUMS.txt; fi
          mv ../SHA256SUMS.txt .
          ls -l
          { echo "### ${{ matrix.name }}"; echo '```'; ls -l; cat SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          test "$(ls | wc -l)" -ge 2
      - uses: actions/upload-artifact@v4
        with:
          name: humming-desktop-${{ matrix.name }}
          path: out/
          if-no-files-found: error
          retention-days: 30
