name: desktop

# Humming for macOS, Windows and Linux (Tauri v2). Builds installers (not code-signed) as workflow artifacts:
# a universal macOS .dmg, Windows .msi + NSIS setup .exe, and Linux .AppImage + .deb. 1.6: also the self-update bundles
# (macOS .app.tar.gz; the .exe, .msi and .AppImage themselves), each with a minisign .sig made with the updater key in
# the TAURI_SIGNING_PRIVATE_KEY secret. release.yml calls this workflow for tagged releases and publishes them.

on:
  push:
    branches: ["**"]
    paths: ["desktop/**", "core/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "core/**", ".github/workflows/desktop.yml"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when release.yml calls this workflow, so the two never cancel each other.
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (Linux compile + unit tests)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libxdo-dev libssl-dev cmake clang > /dev/null
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"
          prefix-key: v3-sherpa
      - name: sherpa-onnx static libraries present
        # sherpa-onnx-sys downloads its prebuilt static libraries into target/sherpa-onnx-prebuilt from its build
        # script. The Rust cache prunes the library files but can leave the empty lib/ folders behind, and the build
        # script trusts any existing lib/ folder, so linking fails ("could not find native static library
        # sherpa-onnx-c-api"). When the libraries are missing, delete the whole prebuilt folder (empty dirs included)
        # and re-run the build script, so it downloads and unpacks a fresh copy.
        shell: bash
        working-directory: desktop/src-tauri
        run: |
          if [ -d target ] && ! find target -path '*sherpa-onnx-prebuilt*' \( -name 'libsherpa-onnx-c-api*' -o -name 'sherpa-onnx-c-api*.lib' \) | grep -q .; then
            echo "prebuilt sherpa-onnx libraries missing from the cache: removing the stale folder, re-running its build script"
            find target -maxdepth 4 -type d -name sherpa-onnx-prebuilt -prune -exec rm -rf {} +
            cargo clean -p sherpa-onnx-sys || true
            for t in $(echo "${RUST_TARGETS:-}" | tr ',' ' '); do cargo clean -p sherpa-onnx-sys --target "$t" || true; done
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Frontend (type check + build)
        working-directory: desktop
        run: npm ci && npm run build
      - name: cargo test (desktop shell, cleanup port, model catalog)
        working-directory: desktop/src-tauri
        run: cargo test
      - name: End to end on a real clip (Fast model download + SHA-256 + unpack, Parakeet, cleanup)
        working-directory: desktop/src-tauri
        run: |
          mkdir -p "$RUNNER_TEMP/clip" && cd "$RUNNER_TEMP/clip"
          curl -sSL -o m.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-nemo-parakeet_tdt_ctc_110m-en-36000-int8.tar.bz2
          tar xjf m.tar.bz2 --wildcards '*/test_wavs/*' && rm m.tar.bz2
          WAV=$(find "$RUNNER_TEMP/clip" -name '*.wav' | sort | head -1); echo "clip: $WAV"
          cd "$GITHUB_WORKSPACE/desktop/src-tauri"
          HUMMING_E2E_WAV="$WAV" cargo test e2e_fast_model_on_a_real_clip -- --nocapture 2>&1 | tee "$RUNNER_TEMP/e2e.log"
          grep '^E2E' "$RUNNER_TEMP/e2e.log" >> "$GITHUB_STEP_SUMMARY"
      - name: core tests without whisper.cpp (VAD, lists, dictionary)
        working-directory: core
        run: cargo test --no-default-features --lib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-Cargo.lock
          path: desktop/src-tauri/Cargo.lock
          if-no-files-found: ignore

  build:
    needs: check
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: windows-x64
            os: windows-latest
            args: ""
            rust_targets: ""
          - name: linux-x64
            os: ubuntu-22.04
            args: --bundles appimage,deb
            rust_targets: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libxdo-dev libssl-dev cmake clang patchelf file > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"
          key: ${{ matrix.name }}
          prefix-key: v3-sherpa
      - name: sherpa-onnx static libraries present
        # sherpa-onnx-sys downloads its prebuilt static libraries into target/sherpa-onnx-prebuilt from its build
        # script. The Rust cache prunes the library files but can leave the empty lib/ folders behind, and the build
        # script trusts any existing lib/ folder, so linking fails ("could not find native static library
        # sherpa-onnx-c-api"). When the libraries are missing, delete the whole prebuilt folder (empty dirs included)
        # and re-run the build script, so it downloads and unpacks a fresh copy.
        shell: bash
        working-directory: desktop/src-tauri
        env:
          RUST_TARGETS: ${{ matrix.rust_targets }}
        run: |
          if [ -d target ] && ! find target -path '*sherpa-onnx-prebuilt*' \( -name 'libsherpa-onnx-c-api*' -o -name 'sherpa-onnx-c-api*.lib' \) | grep -q .; then
            echo "prebuilt sherpa-onnx libraries missing from the cache: removing the stale folder, re-running its build script"
            find target -maxdepth 4 -type d -name sherpa-onnx-prebuilt -prune -exec rm -rf {} +
            cargo clean -p sherpa-onnx-sys || true
            for t in $(echo "${RUST_TARGETS:-}" | tr ',' ' '); do cargo clean -p sherpa-onnx-sys --target "$t" || true; done
          fi
      - name: npm ci
        working-directory: desktop
        run: npm ci
      - name: Updater key available? (tagged releases require it; other builds go unsigned without it)
        # With a public key in tauri.conf.json, Tauri refuses to build update bundles without the private key. Pull
        # requests from forks get no secrets, so they build installers without update bundles instead of failing.
        id: sign
        shell: bash
        working-directory: desktop
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"; echo "args=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set: a tagged release needs signed self-update bundles"; exit 1
          fi
          echo "::warning::no updater signing key in this run: building installers without self-update bundles"
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > src-tauri/tauri.unsigned.conf.json
          echo "signed=false" >> "$GITHUB_OUTPUT"; echo "args=--config src-tauri/tauri.unsigned.conf.json" >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          # Updater signing key (minisign). Signs the self-update bundles; the public half is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }} ${{ steps.sign.outputs.args }}
      - name: Collect installers and checksums
        shell: bash
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          mkdir -p out
          find desktop/src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.AppImage' -o -name '*.deb' \
               -o -name '*.app.tar.gz' -o -name '*.sig' \) -exec cp {} out/ \;
          cd out
          # The macOS update bundle comes out as Humming.app.tar.gz: give it the versioned release name.
          V=$(node -p "require('../desktop/src-tauri/tauri.conf.json').version")
          for f in Humming.app.tar.gz Humming.app.tar.gz.sig; do
            if [ -f "$f" ]; then mv "$f" "Humming_${V}_universal${f#Humming}"; fi
          done
          # Every self-update bundle must have its signature (unsigned runs have no update bundles to check).
          [ "$SIGNED" = "true" ] && for f in *.app.tar.gz *-setup.exe *.msi *.AppImage; do
            [ -f "$f" ] || continue
            [ -s "$f.sig" ] || { echo "::error::$f has no updater signature (.sig)"; exit 1; }
          done
          if command -v sha256sum > /dev/null; then sha256sum -- * > ../SHA256SUMS.txt; else shasum -a 256 -- * > ../SHA256SUMS.txt; fi
          mv ../SHA256SUMS.txt .
          ls -l
          { echo "### ${{ matrix.name }}"; echo '```'; ls -l; cat SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          test "$(ls | wc -l)" -ge 2
      - uses: actions/upload-artifact@v4
        with:
          name: humming-desktop-${{ matrix.name }}
          path: out/
          if-no-files-found: error
          retention-days: 30
