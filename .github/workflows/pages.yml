name: pages

# Publishes the Humming website (play/site/: the home page and the privacy policy) to GitHub Pages, with the banner
# and screenshots copied in from docs/. 1.6: also mirrors the LATEST GitHub Release's update files to /updates/
# (latest.json + the signed desktop update bundles, android.json + the APK, SHA256SUMS.txt). The repository is private,
# so release downloads need a token; the apps read their update feeds from here instead. release.yml calls this after
# each release, and every site deploy carries the mirror along, then checks the live feed's signatures.
on:
  push:
    branches: ["main"]
    paths: ["play/site/**", "docs/banner.png", "docs/screenshots/**", "landing/icon.png", ".github/workflows/pages.yml",
            "scripts/verify_updater.py"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/img
          cp -R play/site/. _site/
          cp docs/banner.png landing/icon.png _site/img/
          for f in android_dictation.gif android_themes.gif android_keyboard_dark.png android_settings_voice.png \
                   ios_walkthrough.gif ios_dictate.png ios_settings.png ios_keyboard.png \
                   desktop_dictation.gif desktop_home_dark.png desktop_history.png desktop_settings.png; do
            cp "docs/screenshots/$f" _site/img/
          done
          ls -la _site _site/img
      - name: Mirror the latest release's update files to /updates/
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _site/updates
          if ! gh release view --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null 2>&1; then
            echo "no release yet"; exit 0
          fi
          cd _site/updates
          gh release download --repo "$GITHUB_REPOSITORY" --clobber \
            -p latest.json -p android.json -p SHA256SUMS.txt -p 'Humming-*.apk' \
            -p '*.app.tar.gz' -p '*.app.tar.gz.sig' -p '*-setup.exe' -p '*-setup.exe.sig' \
            -p '*.msi' -p '*.msi.sig' -p '*.AppImage' -p '*.AppImage.sig' -p '*.dmg' || true
          if [ -f latest.json ]; then
            sha256sum -c --ignore-missing SHA256SUMS.txt
          else
            echo "the latest release has no update feed (released before 1.6): nothing mirrored"
            rm -f ./*
          fi
          ls -la
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Check the live update feeds (signatures against the app's public key)
        if: hashFiles('_site/updates/latest.json') != ''
        run: |
          set -euo pipefail
          pip install -q pynacl
          BASE="${{ steps.deployment.outputs.page_url }}updates"
          for i in 1 2 3 4 5 6; do curl -fsS -o /dev/null "$BASE/latest.json" && break; sleep 20; done
          python3 scripts/verify_updater.py --config desktop/src-tauri/tauri.conf.json --latest "$BASE/latest.json" --download \
            | tee -a "$GITHUB_STEP_SUMMARY"
          curl -fsS "$BASE/android.json" | tee -a "$GITHUB_STEP_SUMMARY"
