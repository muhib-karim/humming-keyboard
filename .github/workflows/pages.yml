name: pages

# Publishes the Humming website (play/site/: home page, privacy policy, 404, sitemap) to GitHub Pages, with the
# screenshots and social image copied in from docs/ by scripts/assemble_site.py and checked by scripts/check_site.py. 1.6: also mirrors the LATEST GitHub Release's update files to /updates/
# (latest.json + the signed desktop update bundles, android.json + the APK, SHA256SUMS.txt). The apps read their
# update feeds from here, so they never need a GitHub login. release.yml calls this after
# each release, and every site deploy carries the mirror along, then checks the live feeds: each must be the file this
# run deployed (not a cached older one), and every desktop bundle this site serves must match its signature.
on:
  push:
    branches: ["main"]
    paths: ["play/site/**", "docs/banner.png", "docs/social-preview.png", "docs/screenshots/**", "landing/icon.png",
            ".github/workflows/pages.yml", "scripts/assemble_site.py", "scripts/check_site.py", "scripts/verify_updater.py"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_feeds: ${{ steps.feeds.outputs.has_feeds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Assemble the site
        # play/site/ plus the screenshots it shows (copied from docs/), then a check that every local link, image and
        # #anchor resolves, tags balance and nothing loads from another origin. The same two scripts run locally.
        run: |
          python3 scripts/assemble_site.py _site
          python3 scripts/check_site.py _site
          ls -la _site _site/img
      - name: Mirror the latest release's update files to /updates/
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _site/updates
          if ! gh release view --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null 2>&1; then
            echo "no release yet"; exit 0
          fi
          cd _site/updates
          gh release download --repo "$GITHUB_REPOSITORY" --clobber \
            -p latest.json -p android.json -p SHA256SUMS.txt -p 'Humming-*.apk' \
            -p '*.app.tar.gz' -p '*.app.tar.gz.sig' -p '*-setup.exe' -p '*-setup.exe.sig' \
            -p '*.msi' -p '*.msi.sig' -p '*.AppImage' -p '*.AppImage.sig' -p '*.dmg' || true
          # Each feed is mirrored on its own: a release without a desktop build still updates Android, and vice versa.
          if [ -f latest.json ] || [ -f android.json ]; then
            sha256sum -c --ignore-missing SHA256SUMS.txt
          else
            echo "the latest release has no update feed (released before 1.6): nothing mirrored"
            rm -f ./*
          fi
          ls -la
      - name: Record whether update feeds were mirrored
        id: feeds
        run: |
          if [ -f _site/updates/latest.json ] || [ -f _site/updates/android.json ]; then
            echo "has_feeds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_feeds=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.feeds.outputs.has_feeds == 'true'
        with:
          name: mirrored-feeds
          path: _site/updates/*.json
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.build.outputs.has_feeds == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.build.outputs.has_feeds == 'true'
        with:
          name: mirrored-feeds
          path: _site/updates
      - name: Check the live desktop update feed (signatures against the app's public key)
        if: hashFiles('_site/updates/latest.json') != ''
        run: |
          set -euo pipefail
          pip install -q pynacl
          BASE="${{ steps.deployment.outputs.page_url }}updates"
          # The CDN can serve the previous deployment for a while: the 1.8.0 release run read a cached 1.7.1 feed here
          # and passed. Wait until the live feed is, byte for byte, the one this run deployed ("?run=" skips the cache).
          live=$(mktemp)
          for i in $(seq 1 15); do
            curl -fsS "$BASE/latest.json?run=${GITHUB_RUN_ID:-0}-$i" > "$live" || true
            if cmp -s "$live" _site/updates/latest.json; then break; fi
            if [ "$i" = 15 ]; then echo "::error::$BASE/latest.json is not the feed this run deployed"; exit 1; fi
            sleep 20
          done
          # Each bundle is fetched from this site by its file name and checked against its signature. The feed of a
          # release made before the update host moved here (1.8.0 and older) still lists the old host.
          python3 scripts/verify_updater.py --config desktop/src-tauri/tauri.conf.json --latest "$live" --download \
            --base-url "$BASE/" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check the live Android update feed
        if: hashFiles('_site/updates/android.json') != ''
        run: |
          set -euo pipefail
          BASE="${{ steps.deployment.outputs.page_url }}updates"
          live=$(mktemp)
          for i in $(seq 1 15); do
            curl -fsS "$BASE/android.json?run=${GITHUB_RUN_ID:-0}-$i" > "$live" || true
            if cmp -s "$live" _site/updates/android.json; then break; fi
            if [ "$i" = 15 ]; then echo "::error::$BASE/android.json is not the feed this run deployed"; exit 1; fi
            sleep 20
          done
          tee -a "$GITHUB_STEP_SUMMARY" < "$live"
