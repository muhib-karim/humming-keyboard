name: pages

# Publishes the Humming website (play/site/: home page, privacy policy, 404, sitemap) to GitHub Pages, with the
# screenshots and social image copied in from docs/ by scripts/assemble_site.py and checked by scripts/check_site.py. 1.6: also mirrors the LATEST GitHub Release's update files to /updates/
# (latest.json + the signed desktop update bundles, android.json + the APK, SHA256SUMS.txt). The apps read their
# update feeds from here, so they never need a GitHub login. release.yml calls this after
# each release, and every site deploy carries the mirror along, then checks the live feed's signatures.
on:
  push:
    branches: ["main"]
    paths: ["play/site/**", "docs/banner.png", "docs/social-preview.png", "docs/screenshots/**", "landing/icon.png",
            ".github/workflows/pages.yml", "scripts/assemble_site.py", "scripts/check_site.py", "scripts/verify_updater.py"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        # play/site/ plus the screenshots it shows (copied from docs/), then a check that every local link, image and
        # #anchor resolves, tags balance and nothing loads from another origin. The same two scripts run locally.
        run: |
          python3 scripts/assemble_site.py _site
          python3 scripts/check_site.py _site
          ls -la _site _site/img
      - name: Mirror the latest release's update files to /updates/
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _site/updates
          if ! gh release view --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null 2>&1; then
            echo "no release yet"; exit 0
          fi
          cd _site/updates
          gh release download --repo "$GITHUB_REPOSITORY" --clobber \
            -p latest.json -p android.json -p SHA256SUMS.txt -p 'Humming-*.apk' \
            -p '*.app.tar.gz' -p '*.app.tar.gz.sig' -p '*-setup.exe' -p '*-setup.exe.sig' \
            -p '*.msi' -p '*.msi.sig' -p '*.AppImage' -p '*.AppImage.sig' -p '*.dmg' || true
          # Each feed is mirrored on its own: a release without a desktop build still updates Android, and vice versa.
          if [ -f latest.json ] || [ -f android.json ]; then
            sha256sum -c --ignore-missing SHA256SUMS.txt
          else
            echo "the latest release has no update feed (released before 1.6): nothing mirrored"
            rm -f ./*
          fi
          ls -la
      - uses: actions/configure-pages@v5
      - id: artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        name: Deploy to GitHub Pages
        # The API call actions/deploy-pages@v4 makes, with one change: deploy-pages names the deployment after the commit
        # SHA, and Pages answers a second deploy of the same SHA with the first one's success without publishing it. A
        # release tag usually points at a commit main already deployed (v1.7.0 did), so its update mirror never went
        # live. Adding the run id makes every deploy publish.
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail
          OIDC=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          ID=$(gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments" -F artifact_id="$ARTIFACT_ID" \
            -f pages_build_version="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -f oidc_token="$OIDC" --jq .id)
          for i in $(seq 60); do
            st=$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$ID" --jq .status)
            echo "deployment $ID: $st"
            case "$st" in
              succeed) break ;;
              *fail*|*error*|*lost*|*cancel*) echo "::error::Pages deployment $st"; exit 1 ;;
            esac
            [ "$i" = 60 ] && { echo "::error::Pages deployment still $st after 10 minutes"; exit 1; }
            sleep 10
          done
          echo "page_url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)" >> "$GITHUB_OUTPUT"
      - name: Check the live desktop update feed (signatures against the app's public key)
        if: hashFiles('_site/updates/latest.json') != ''
        run: |
          set -euo pipefail
          pip install -q pynacl
          BASE="${{ steps.deployment.outputs.page_url }}updates"
          # Pages caches a 404 for its max-age (600 s): a poll that starts before the deploy is live needs over 10 min.
          for i in $(seq 40); do curl -fs -o /dev/null "$BASE/latest.json" && break
            [ "$i" = 40 ] && { echo "::error::$BASE/latest.json not served 13 minutes after the deploy"; exit 1; }; sleep 20; done
          python3 scripts/verify_updater.py --config desktop/src-tauri/tauri.conf.json --latest "$BASE/latest.json" --download \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check the live Android update feed
        if: hashFiles('_site/updates/android.json') != ''
        run: |
          set -euo pipefail
          BASE="${{ steps.deployment.outputs.page_url }}updates"
          # Pages caches a 404 for its max-age (600 s): a poll that starts before the deploy is live needs over 10 min.
          for i in $(seq 40); do curl -fs -o /dev/null "$BASE/android.json" && break
            [ "$i" = 40 ] && { echo "::error::$BASE/android.json not served 13 minutes after the deploy"; exit 1; }; sleep 20; done
          curl -fsS "$BASE/android.json" | tee -a "$GITHUB_STEP_SUMMARY"
