[package]
name = "humming-core"
version = "1.4.0"
edition = "2021"
description = "Humming core: VAD, whisper.cpp speech-to-text and dictation cleanup"
license = "MIT"
publish = false

[lib]
name = "humming_core"
path = "src/lib.rs"
# rlib for Rust hosts (desktop shell), cdylib for Android (.so via JNA/UniFFI), staticlib for iOS.
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "humming-core"
path = "src/main.rs"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen-cli"]

[features]
default = ["whisper"]
whisper = ["dep:whisper-rs"]
metal = ["whisper", "whisper-rs/metal"]
coreml = ["whisper", "whisper-rs/coreml"]
# UniFFI bindings (Kotlin/Swift). Independent of `whisper`, so bindings can be generated from a fast build.
ffi = ["dep:uniffi"]
bindgen-cli = ["ffi", "uniffi/cli"]

[dependencies]
whisper-rs = { version = "0.16", optional = true }
uniffi = { version = "0.32", optional = true }
hound = "3.5"
regex = "1"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

