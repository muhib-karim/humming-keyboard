[package]
name = "humming-desktop"
version = "1.5.0"
description = "Humming for Windows and macOS: hold a hotkey, speak, and clean text lands in whatever app has focus"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "humming_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
enigo = "0.2"
arboard = "3"
ureq = "2"
sha2 = "0.10"
hex = "0.4"
tar = "0.4"
bzip2 = "0.6"
fancy-regex = "0.14"
once_cell = "1"
# Speech-to-text: the same engine and version as the Android app (NVIDIA Parakeet on sherpa-onnx 1.13.8).
# Links sherpa-onnx's prebuilt static libraries for the target (downloaded by its build script).
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["static"] }
# Shared Humming core without whisper.cpp: energy VAD and spoken-list formatting.
humming-core = { path = "../../core", default-features = false }

# Per-app dictionary (1.5): the focused app's process name on Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = 3
strip = true
