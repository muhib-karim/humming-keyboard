<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- Source for docs/social-preview.png (rendered with Pillow from the same layout by scripts/render_social_preview.py).
       Screens are real captures from docs/; paths are relative to this file. -->
  <title>Humming: private voice typing that works offline</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.25" stop-color="#0F0F13"/>
      <stop offset="1" stop-color="#2E1020"/>
    </linearGradient>
    <clipPath id="icon"><rect x="88" y="96" width="96" height="96" rx="22"/></clipPath>
    <clipPath id="front"><rect x="800" y="70" width="252" height="540" rx="30"/></clipPath>
    <clipPath id="back"><rect x="1010" y="60" width="210" height="480" rx="30"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="10" dy="18" stdDeviation="18" flood-opacity="0.55"/></filter>
    <style>
      text { font-family: "Liberation Sans", Arial, system-ui, sans-serif; }
      .name { font-size: 64px; font-weight: 700; fill: #F4F4F7; }
      .h { font-size: 50px; font-weight: 700; fill: #F4F4F7; }
      .h2 { font-size: 50px; font-weight: 700; fill: #F0607F; }
      .sub { font-size: 25px; fill: #B2B2BE; }
      .chip { font-size: 21px; font-weight: 700; fill: #F4F4F7; }
      .foot { font-size: 21px; fill: #8C8C98; }
    </style>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <image href="../play/graphics/icon-512.png" x="88" y="96" width="96" height="96" clip-path="url(#icon)"/>
  <text x="204" y="164" class="name">Humming</text>
  <text x="88" y="296" class="h">Private voice typing</text>
  <text x="88" y="358" class="h2">that works offline.</text>
  <text x="88" y="422" class="sub">On-device speech recognition. No account, no word caps.</text>
    <rect x="88" y="470" width="112" height="42" rx="21" fill="none" stroke="#E5486B" stroke-width="2"/>
    <text x="104" y="498" class="chip">Android</text>
    <rect x="212" y="470" width="102" height="42" rx="21" fill="none" stroke="#E5486B" stroke-width="2"/>
    <text x="228" y="498" class="chip">iPhone</text>
    <rect x="326" y="470" width="124" height="42" rx="21" fill="none" stroke="#E5486B" stroke-width="2"/>
    <text x="342" y="498" class="chip">Windows</text>
    <rect x="462" y="470" width="104" height="42" rx="21" fill="none" stroke="#E5486B" stroke-width="2"/>
    <text x="478" y="498" class="chip">macOS</text>
    <rect x="579" y="470" width="88" height="42" rx="21" fill="none" stroke="#E5486B" stroke-width="2"/>
    <text x="595" y="498" class="chip">Linux</text>
  <text x="88" y="570" class="foot">Free and open source (Apache-2.0)</text>
  <g filter="url(#shadow)">
    <rect x="1000" y="50" width="230" height="500" rx="38" fill="#1E1E25" stroke="#464652" stroke-width="2"/>
    <image href="screenshots/ios_dictate_dark.png" x="1010" y="60" width="210" height="480" preserveAspectRatio="xMidYMid slice" clip-path="url(#back)"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="790" y="60" width="272" height="560" rx="38" fill="#1E1E25" stroke="#464652" stroke-width="2"/>
    <image href="images/hero_voice.png" x="800" y="70" width="252" height="540" preserveAspectRatio="xMidYMid slice" clip-path="url(#front)"/>
  </g>
</svg>
